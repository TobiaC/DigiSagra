<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Tombola - Regia</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>Tombola — Postazione di Regia</h1>

  <div class="controls">
    <form id="drawForm" autocomplete="off">
      <input type="number" id="numberInput" min="1" max="90" placeholder="Numero estratto (1-90)" required />
      <button type="submit">✅ Conferma numero</button>
    </form>
    <button id="resetBtn" class="secondary">Nuova partita</button>
  </div>

  <div class="current-panel">
    <div class="label">Numero estratto</div>
    <div id="current" class="current-number">-</div>
  </div>

  <div class="info">
    Numeri rimasti: <strong id="remaining">90</strong>
  </div>

  <h2>Tabellone</h2>
  <div id="grid" class="grid"></div>

  <script src="/shared.js"></script>
  <script src="/host.js"></script>
</body>
</html>
